name: Daily update

# After each close, compute the session once and publish it for the website:
#   front page (尾盘选股, A-shares and Hong Kong), volume books, Strategy lab live record.
# The results go to the `results` branch as ONE commit that replaces the previous one, so nothing
# piles up in the repository's history and `main` (your code) is never touched. The website reads
# that branch, so it shows fixed figures after the close without recomputing or redeploying.
#
# Several start times: GitHub sometimes skips or delays a scheduled run. Every step checks what is
# already saved, so a later run that finds the work done finishes in a minute.
on:
  schedule:
    - cron: "5 7 * * 1-5"    # 15:05 Beijing - A-shares closed
    - cron: "40 7 * * 1-5"   # 15:40 Beijing - retry
    - cron: "2 8 * * 1-5"    # 16:02 Beijing - the after-close screen (收盘选股)
    - cron: "15 8 * * 1-5"   # 16:15 Beijing - Hong Kong closed
    - cron: "30 9 * * 1-5"   # 17:30 Beijing - retry
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start from the published results
        run: |
          if git fetch --depth=1 -q origin results 2>/dev/null; then
            mv results results_main && mkdir results
            git archive FETCH_HEAD | tar -x -C results
            # Past sessions kept in main; published ones win (newer cp returns an error when it skips a file).
            cp -rn results_main/cn results_main/hk results/ || true
            echo "Starting from the published results branch."
          else
            echo "No results branch yet: starting from the copy in main."
          fi
      - name: Update
        env:
          STOCKRT_WORKERS: "24"
          STOCKRT_PUBLISHED: "0"
        run: python scripts/daily_update.py
      - name: Publish to the results branch (one commit, replaced each time)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd results
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results published $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') Beijing"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/tree/results"
