name: Desktop app

# Builds the Windows desktop app and puts it on the repository's "desktop" release:
#   ChinaHKMarkets.exe        the launcher - what people download (the window; keeps itself up to date)
#   ChinaHKMarketsCore.zip    the program itself (the whole site, run on the user's PC - no website involved)
#   version.json              build ids and SHA-256 of both: installed copies compare themselves with it
# Only the newest version is kept. Runs when the program or the launcher changes, or by hand
# (Actions -> Desktop app -> Run workflow). The program is started and checked before anything is published.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "stockrt/**"
      - "ui/**"
      - "app_pages/**"
      - "streamlit_app.py"
      - ".streamlit/**"
      - "results/**"
      - "research/lab_pools/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Python for the program (the versions it was tested with)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build the program
        run: |
          pip install -r desktop/requirements-core.txt "pyinstaller>=6.11"
          python desktop/build.py core
      - name: Start it and check it (server answers, a page loads, a worker job runs)
        run: python desktop/build.py smoke
      - name: Zip it
        run: python desktop/build.py zip

      - name: Python for the launcher
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the launcher
        run: |
          pip install -r desktop/requirements.txt
          python desktop/build.py launcher
      - name: Version file
        run: python desktop/build.py version

      - name: Publish to the "desktop" release (the files first, then the version that points to them)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --title "Desktop app (Windows)" \
            --notes "Download ChinaHKMarkets.exe and run it. It fetches the program (ChinaHKMarketsCore.zip) once, runs it on your PC and keeps both up to date. Rebuilt automatically when the program changes."
          gh release upload desktop dist/ChinaHKMarketsCore.zip --clobber
          gh release upload desktop dist/ChinaHKMarkets.exe --clobber
          gh release upload desktop dist/version.json --clobber
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop/ChinaHKMarkets.exe"
