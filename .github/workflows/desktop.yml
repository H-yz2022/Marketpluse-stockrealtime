name: Desktop app

# Builds the Windows app (dist/ChinaHKMarkets.exe) and puts it on the repository's "desktop" release, with
# version.json (build id + SHA-256). Installed copies read version.json at start and update themselves to it.
# Runs when the desktop code changes, or by hand (Actions -> Run workflow). Only the newest version is kept.
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: pip install -r desktop/requirements.txt
      - name: Build
        shell: bash
        run: |
          echo "BUILD = \"${GITHUB_SHA::12}\"" > desktop/build_info.py
          python desktop/make_icon.py
          pyinstaller --noconfirm --onefile --windowed --name ChinaHKMarkets --icon desktop/icon.ico \
            --paths desktop --hidden-import build_info desktop/app.py
          python - <<'EOF'
          import hashlib, json, os, time
          data = open("dist/ChinaHKMarkets.exe", "rb").read()
          json.dump({"build": os.environ["GITHUB_SHA"][:12], "sha256": hashlib.sha256(data).hexdigest(),
                     "size": len(data), "built": time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime())},
                    open("dist/version.json", "w"))
          EOF
          cat dist/version.json
      - name: Publish to the "desktop" release (the exe first, then the version that points to it)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --title "Desktop app (Windows)" \
            --notes "ChinaHKMarkets.exe opens https://china-hk-markets.streamlit.app/ in its own window and updates itself. Rebuilt automatically when the desktop code changes."
          gh release upload desktop dist/ChinaHKMarkets.exe --clobber
          gh release upload desktop dist/version.json --clobber
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop/ChinaHKMarkets.exe"
